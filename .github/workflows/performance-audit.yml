name: Performance Audit

on:
  workflow_dispatch:
  # Allow manual triggering for performance audits
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: "0 3 * * 0"
  pull_request:
    paths:
      - "storage/**"
      - "protocol/**"
      - "lua/**"
      - "**/*_bench_test.go"
      - "scripts/perf/**"
      - ".github/workflows/performance-audit.yml"

# Historical note: the monolithic `performance-audit` job that drove
# `scripts/perf/bench.sh` across 5 packages with count=5/benchtime=3s was
# removed in #33 (issue #31). It had been failing on `main` continuously
# since 2025-12-21 because the configuration was too aggressive for an
# ubuntu-latest runner (~70 min total, flaky) AND duplicated coverage that
# `storage-benchmarks` / `protocol-benchmarks` already provide with more
# sensible parameters. The root package's BenchmarkReplication* require a
# Redis sidecar and were silently skipped in that job; they are covered by
# `.github/workflows/benchmarks.yml` (which runs them with a Redis service).
#
# `scripts/perf/bench.sh` remains available for local developer use via
# `make bench-all`. It is no longer invoked from CI.

jobs:
  storage-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run storage benchmarks
        run: |
          echo "Running storage benchmarks with detailed metrics..."
          GOMAXPROCS=4 go test -bench=. -run=^$ -benchmem -benchtime=3s -count=3 ./storage/ | tee storage_bench.txt
        env:
          GOMAXPROCS: 4
        continue-on-error: true

      - name: Analyze storage performance
        if: always()
        run: |
          echo "## Storage Benchmark Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f storage_bench.txt ]; then
            echo "### Key Storage Operations" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep "BenchmarkStorage" storage_bench.txt | head -20 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload storage benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-benchmarks
          path: storage_bench.txt
          retention-days: 30
          if-no-files-found: ignore

  protocol-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run protocol benchmarks
        run: |
          echo "Running RESP protocol benchmarks..."
          GOMAXPROCS=4 go test -bench=. -run=^$ -benchmem -benchtime=3s -count=3 ./protocol/ | tee protocol_bench.txt
        env:
          GOMAXPROCS: 4
        continue-on-error: true

      - name: Analyze protocol performance
        if: always()
        run: |
          echo "## Protocol Benchmark Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f protocol_bench.txt ]; then
            echo "### RESP Parser/Writer Performance" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep "Benchmark" protocol_bench.txt | head -20 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload protocol benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-benchmarks
          path: protocol_bench.txt
          retention-days: 30
          if-no-files-found: ignore

  lua-benchmarks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run lua benchmarks
        run: |
          echo "Running Lua engine benchmarks..."
          GOMAXPROCS=4 go test -bench=. -run=^$ -benchmem -benchtime=3s -count=3 ./lua/ | tee lua_bench.txt
        env:
          GOMAXPROCS: 4
        continue-on-error: true

      - name: Analyze lua performance
        if: always()
        run: |
          echo "## Lua Engine Benchmark Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f lua_bench.txt ]; then
            echo "### Lua Script Execution & Cache" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep "Benchmark" lua_bench.txt | head -20 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload lua benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lua-benchmarks
          path: lua_bench.txt
          retention-days: 30
          if-no-files-found: ignore
